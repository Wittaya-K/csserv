services:
  app:
    build: .
    container_name: csserv_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: csserv_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: csserv_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: uQPFVu(Oyfa3a[H5
      MYSQL_DATABASE: srsdb
      MYSQL_USER: srsdb
      MYSQL_PASSWORD: uQPFVu(Oyfa3a[H5
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
